<!DOCTYPE html>

    <script>
        // ✅ 👇 把这里换成你最新的链接！
        const API_URL = "https://script.google.com/macros/s/AKfycbxnR2TiYc-DJrsuz6WH0ElAywmYudTrJ1b7xpzIfDMT-FmLuesDk-nCMsmec1XwHbes8A/exec";
        const ADMIN_PASSWORD = 'modernedu';
        const DEFAULT_DRIVERS = ['Uncle Alan','Uncle Arnold','Uncle Brandon','Uncle How'];

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei", "Noto Sans SC", sans-serif; }
        :root { --primary:#0052cc; --success:#009933; --danger:#e63300; --light:#f0f7ff; --border:#ccd6eb; }
        body { background:#f0f7ff; padding:15px; max-width:1000px; margin:0 auto; color:#333; }
        header { text-align:center; padding:20px; background:#fff; border-radius:12px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,82,204,.1); }
        h1 { color:var(--primary); font-size:22px; margin-bottom:5px; }
        .sync-status { display:inline-block; font-size:13px; padding:4px 10px; border-radius:20px; margin-left:10px; }
        .sync-ok { background:#d6f5e3; color:#006622; }
        .sync-sending { background:#fff4cc; color:#805c00; }
        .sync-error { background:#ffebe6; color:#cc2900; }
        .tabs { display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
        .tab { flex:1; min-width:100px; padding:10px 6px; border:none; border-radius:8px; background:#fff; color:#555; cursor:pointer; font-size:13px; transition:all .2s; }
        .tab.active { background:var(--primary); color:#fff; font-weight:bold; }
        .tab.hidden-tab { display:none !important; }
        .card { background:#fff; border-radius:12px; padding:22px; margin-bottom:18px; box-shadow:0 2px 6px rgba(0,82,204,.08); }
        .card h2 { font-size:17px; color:var(--primary); margin-bottom:18px; padding-bottom:10px; border-bottom:1px solid var(--light); }
        .row { display:flex; gap:15px; flex-wrap:wrap; }
        .col { flex:1; min-width:200px; }
        .group { margin-bottom:16px; }
        label { display:block; margin-bottom:6px; font-weight:500; font-size:14px; }
        input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font-size:15px; background:#fff; }
        .btn { padding:12px 24px; border:none; border-radius:8px; font-size:16px; cursor:pointer; font-weight:500; margin-right:10px; margin-top:8px; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-secondary { background:var(--light); color:var(--primary); }
        .btn-sm { padding:6px 12px; font-size:14px; margin:0 4px; }
        .hidden { display:none !important; }
        .empty { text-align:center; color:#888; padding:30px; }
        .filter-bar { background:#e6f0ff; padding:12px 16px; border-radius:8px; margin-bottom:18px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
        .record { border-left:4px solid var(--primary); padding:14px; margin:12px 0; background:var(--light); border-radius:0 8px 8px 0; }
        .record.transport { border-color:var(--primary); background:#e6f0ff; }
        .record.check { border-color:#e67700; background:#fff4e6; }
        .record.wash { border-color:var(--success); background:#e6ffe6; }
        .auth-banner { background:#e6f0ff; padding:10px 15px; border-radius:8px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; }
        .auth-banner .user { font-weight:bold; color:var(--primary); }
        .password-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; }
        .password-box { background:#fff; padding:30px; border-radius:12px; max-width:360px; width:90%; }
        .light-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
        .light-item { flex:1; min-width:140px; }
        h3 { font-size:15px; margin:18px 0 10px; color:#444; }
    </style>
</head>

<script>
let driversList = [...DEFAULT_DRIVERS];
let currentUser = null;
let transportData = [], checkData = [], washData = [], attendanceState = {};

function todayStr() { return new Date().toISOString().split('T')[0]; }

async function apiGet(action, params={}) {
    const u = new URL(API_URL);
    u.searchParams.set('action', action);
    Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
    try {
        const r = await fetch(u.toString(), {cache:'no-store'});
        const txt = await r.text();
        const clean = txt.replace(/^[^[{]*/, '').replace(/[^}\]]*$/, '');
        return JSON.parse(clean);
    } catch(e) { return {ok:false, msg:e+''}; }
}

async function apiPost(data) {
    updateSyncStatus('sending');
    try {
        const sep = API_URL.includes('?') ? '&' : '?';
        const params = new URLSearchParams();
        Object.entries(data).forEach(([k, v]) => {
            params.append(k, typeof v === 'string' ? v : JSON.stringify(v));
        });
        const res = await fetch(API_URL + sep + params.toString(), { cache: 'no-store' });
        const txt = await res.text();
        const clean = txt.replace(/^[^[{]*/, '').replace(/[^}\]]*$/, '');
        const result = JSON.parse(clean);
        if (result.ok) { 
            updateSyncStatus('ok'); 
            await loadAllFromCloud(); 
        } else {
            updateSyncStatus('error');
        }
        return result;
    } catch(e) {
        updateSyncStatus('error');
        return { ok: false, msg: e + '' };
    }
}

function updateSyncStatus(s) {
    const el = document.getElementById('syncStatus');
    el.className = 'sync-status';
    if(s==='ok') { el.textContent='✅ 已同步'; el.classList.add('sync-ok'); }
    else if(s==='sending') { el.textContent='⏳ 提交中...'; el.classList.add('sync-sending'); }
    else { el.textContent='⚠️ 连接异常'; el.classList.add('sync-error'); }
}

async function loadAllFromCloud() {
    const res = await apiGet('getAll');
    if(res.ok && res.data) {
        if(res.data.drivers?.length>0) driversList=res.data.drivers;
        transportData = res.data.transport || [];
        checkData = res.data.check || [];
        washData = res.data.wash || [];
        attendanceState = res.data.attendance || {};
        refreshDriverSelect();
        populateDriverFilters();
        renderMyRecords();
        renderAllRecords();
        updateSyncStatus('ok');
    } else {
        refreshDriverSelect();
        updateSyncStatus('error');
    }
}

function refreshDriverSelect() {
    const s=document.getElementById('driverSelect');
    const c=s.value;
    s.innerHTML='<option value="">— 请选择 —</option>';
    driversList.forEach(n=>s.appendChild(new Option(n,n)));
    s.value=c;
}

function populateDriverFilters() {
    const sel = document.getElementById('filterDriver');
    const cur = sel.value;
    sel.innerHTML='<option value="all">— 全部司机 —</option>';
    driversList.forEach(n=>sel.appendChild(new Option(n,n)));
    sel.value=cur;
}

document.getElementById('driverSelect').addEventListener('change',e=>{
    document.getElementById('enterBtn').disabled=!e.target.value;
});

function loginAsDriver() {
    const n=document.getElementById('driverSelect').value;
    if(!n)return;
    currentUser={name:n,role:'driver'};
    enterSystem();
}

function verifyAdmin() {
    if(document.getElementById('adminPwdInput').value===ADMIN_PASSWORD){
        currentUser={name:'管理员',role:'admin'};
        document.getElementById('adminLoginModal').classList.add('hidden');
        enterSystem();
    }else alert('❌ 密码错误');
}

function enterSystem() {
    document.getElementById('loginArea').classList.add('hidden');
    document.getElementById('authBanner').classList.remove('hidden');
    document.getElementById('currentUserName').textContent=currentUser.name;
    document.getElementById('mainTabs').classList.remove('hidden');
    document.getElementById('contentArea').classList.remove('hidden');
    
    document.getElementById('trDate').value=todayStr();
    document.getElementById('chkDate').value=todayStr();
    document.getElementById('washDate').value=todayStr();
    document.getElementById('myRecDriverName').textContent=currentUser.name;
    
    if(currentUser.role==='driver'){
        document.querySelectorAll('.driver-tab').forEach(t=>t.classList.remove('hidden-tab'));
        document.querySelectorAll('.admin-tab').forEach(t=>t.classList.add('hidden-tab'));
        document.getElementById('trDriver').value=currentUser.name;
        document.getElementById('chkDriver').value=currentUser.name;
        document.getElementById('washDriver').value=currentUser.name;
        switchTab('transport');
    }else{
        document.querySelectorAll('.driver-tab').forEach(t=>t.classList.add('hidden-tab'));
        document.querySelectorAll('.admin-tab').forEach(t=>t.classList.remove('hidden-tab'));
        switchTab('allRecords');
    }
}

function logout() {
    currentUser=null;
    document.getElementById('loginArea').classList.remove('hidden');
    document.getElementById('authBanner').classList.add('hidden');
    document.getElementById('mainTabs').classList.add('hidden');
    document.getElementById('contentArea').classList.add('hidden');
    document.getElementById('driverSelect').value='';
    document.getElementById('enterBtn').disabled=true;
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));
function switchTab(n){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelector(`[data-tab="${n}"]`).classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.add('hidden'));
    document.getElementById(n).classList.remove('hidden');
    if(n==='myRecords')renderMyRecords();
    if(n==='allRecords')renderAllRecords();
}

function buildMergedList() {
    const list=[];
    transportData.forEach(r=>{ list.push({...r,_type:'transport'}); });
    checkData.forEach(r=>{ list.push({...r,_type:'check'}); });
    washData.forEach(r=>{ list.push({...r,_type:'wash'}); });
    return list.sort((a,b)=>b.id-a.id);
}

function getTypeLabel(t){
    return {transport:'📊 载送统计',check:'🚗 车辆检查',wash:'🧼 洗车打卡'}[t]||t;
}

function renderMyRecords(){
    const filter = document.getElementById('myRecFilter').value;
    const all = buildMergedList().filter(r=>r.driver===currentUser?.name);
    const filtered = filter==='all' ? all : all.filter(r=>r._type===filter);
    const c=document.getElementById('myRecordsList');
    if(!filtered.length){c.innerHTML='<p class="empty">暂无记录</p>';return;}
    c.innerHTML=filtered.map(r=>`<div class="record ${r._type}">
        <strong>${r.date} · ${getTypeLabel(r._type)}</strong><br>
        车牌：${r.plate||'—'} | ${r.dest||r.period||r.washType||''}${r.count?' | '+r.count+'人':''}
    </div>`).join('');
}

function renderAllRecords(){
    const fd = document.getElementById('filterDriver').value;
    const ft = document.getElementById('filterType').value;
    let list = buildMergedList();
    if(fd!=='all') list=list.filter(r=>r.driver===fd);
    if(ft!=='all') list=list.filter(r=>r._type===ft);
    const c=document.getElementById('allRecordsList');
    if(!list.length){c.innerHTML='<p class="empty">暂无记录</p>';return;}
    c.innerHTML=list.map(r=>`<div class="record ${r._type}">
        <strong>${r.date} · ${getTypeLabel(r._type)} · ${r.driver}</strong><br>
        车牌：${r.plate||'—'} | ${r.dest||r.period||r.washType||''}${r.count?' | '+r.count+'人':''}
    </div>`).join('');
}

function exportAll(){
    const fd = document.getElementById('filterDriver').value;
    const ft = document.getElementById('filterType').value;
    let list = buildMergedList();
    if(fd!=='all') list=list.filter(r=>r.driver===fd);
    if(ft!=='all') list=list.filter(r=>r._type===ft);
    if(!list.length){alert('暂无数据');return;}
    const csv='\uFEFF日期,类型,司机,车牌,详情\n'+
        list.map(r=>`${r.date},${getTypeLabel(r._type)},${r.driver},"${r.plate||''}","${(r.dest||r.remark||'').replace(/"/g,'""')}"`).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`载送数据_${todayStr()}.csv`;
    a.click();
}
